accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Unicode-3.0",
    "Zlib",
]

ignore-dev-dependencies = true

# epaint_default_fonts includes fonts under OFL-1.1 and Ubuntu Font License.
# UFL-1.0 is not a standard SPDX identifier, so we clarify it here.
# The Ubuntu Font License is permissive and compatible with OFL-1.1.
[epaint_default_fonts.clarify]
license = "(MIT OR Apache-2.0) AND OFL-1.1"

[[epaint_default_fonts.clarify.files]]
path = "fonts/OFL.txt"
license = "OFL-1.1"
