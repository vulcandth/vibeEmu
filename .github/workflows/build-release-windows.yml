name: Build Windows Release Binaries

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    name: windows-${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p vibe-emu-ui --target ${{ matrix.target }}

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          $dist = "dist/windows/${{ matrix.target }}"
          $release = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "$release/vibe-emu-ui.exe" "$dist/vibeEmu.exe"
          Copy-Item "$release/LICENSE" "$dist/LICENSE"
          Copy-Item "$release/THIRD_PARTY_LICENSES.md" "$dist/THIRD_PARTY_LICENSES.md"
          Compress-Archive -Path "$dist/*" -DestinationPath "dist/vibeEmu-windows-${{ matrix.target }}.zip" -Force

      - name: Verify packaged artifact
        shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP "vibeEmu-windows-${{ matrix.target }}"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $extract
          Expand-Archive "dist/vibeEmu-windows-${{ matrix.target }}.zip" -DestinationPath $extract
          foreach ($file in @("vibeEmu.exe", "LICENSE", "THIRD_PARTY_LICENSES.md")) {
            if (-not (Test-Path (Join-Path $extract $file))) {
              throw "Missing $file in Windows package"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeEmu-windows-${{ matrix.target }}
          path: dist/vibeEmu-windows-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 30
