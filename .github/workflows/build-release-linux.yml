name: Build Linux Release Binaries

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-linux:
    name: linux-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libgtk-3-dev \
            build-essential \
            pkg-config \
            libfontconfig1-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p vibe-emu-ui --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          dist="dist/linux/${{ matrix.target }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/vibe-emu-ui" "$dist/vibeEmu"
          chmod +x "$dist/vibeEmu"
          tar -C "$dist" -czf "dist/vibeEmu-linux-${{ matrix.target }}.tar.gz" vibeEmu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeEmu-linux-${{ matrix.target }}
          path: dist/vibeEmu-linux-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 30
