name: Build macOS Release Binaries

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-mac:
    name: macos-universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Cache target (release)
        uses: actions/cache@v4
        with:
          path: |
            target/x86_64-apple-darwin/release
            target/aarch64-apple-darwin/release
          key: macos-target-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-target-release-

      - name: Build release (x86_64)
        run: cargo build --release -p vibe-emu-ui --target x86_64-apple-darwin

      - name: Build release (arm64)
        run: cargo build --release -p vibe-emu-ui --target aarch64-apple-darwin

      - name: Create app bundle
        run: |
          release="target/x86_64-apple-darwin/release"
          mkdir -p vibeEmu.app/Contents/{MacOS,Resources}
          lipo -create \
            target/x86_64-apple-darwin/release/vibe-emu-ui \
            target/aarch64-apple-darwin/release/vibe-emu-ui \
            -output vibeEmu.app/Contents/MacOS/vibeEmu
          cp "$release/LICENSE" vibeEmu.app/Contents/MacOS/LICENSE
          cp "$release/THIRD_PARTY_LICENSES.html" vibeEmu.app/Contents/MacOS/THIRD_PARTY_LICENSES.html

          mkdir -p /tmp/iconset.iconset
          cp gfx/vibeEmu_512px.png /tmp/iconset.iconset/icon_512x512.png
          cp gfx/vibeEmu_512px.png /tmp/iconset.iconset/icon_256x256@2x.png
          sips -z 16 16 gfx/vibeEmu_512px.png --out /tmp/iconset.iconset/icon_16x16.png
          sips -z 32 32 gfx/vibeEmu_512px.png --out /tmp/iconset.iconset/icon_16x16@2x.png
          sips -z 32 32 gfx/vibeEmu_512px.png --out /tmp/iconset.iconset/icon_32x32.png
          sips -z 64 64 gfx/vibeEmu_512px.png --out /tmp/iconset.iconset/icon_32x32@2x.png
          sips -z 128 128 gfx/vibeEmu_512px.png --out /tmp/iconset.iconset/icon_128x128.png
          sips -z 256 256 gfx/vibeEmu_512px.png --out /tmp/iconset.iconset/icon_128x128@2x.png
          sips -z 256 256 gfx/vibeEmu_512px.png --out /tmp/iconset.iconset/icon_256x256.png
          iconutil -c icns /tmp/iconset.iconset -o vibeEmu.app/Contents/Resources/vibeEmu.icns

          cat > vibeEmu.app/Contents/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>vibeEmu</string>
            <key>CFBundleIdentifier</key>
            <string>com.vibeemu.vibeemu</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleIconFile</key>
            <string>vibeEmu.icns</string>
            <key>CFBundleName</key>
            <string>vibeEmu</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.0.0</string>
            <key>CFBundleVersion</key>
            <string>0</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.13</string>
          </dict>
          </plist>
          PLIST

          chmod +x vibeEmu.app/Contents/MacOS/vibeEmu

      - name: Verify universal binary
        run: lipo -info vibeEmu.app/Contents/MacOS/vibeEmu

      - name: Package app bundle (zip)
        run: |
          mkdir -p dist/macos
          rm -f dist/macos/vibeEmu.app.zip
          ditto -c -k --sequesterRsrc --keepParent vibeEmu.app dist/macos/vibeEmu.app.zip

      - name: Verify packaged artifact
        run: |
          unzip -l dist/macos/vibeEmu.app.zip | grep -F "vibeEmu.app/Contents/MacOS/vibeEmu"
          unzip -l dist/macos/vibeEmu.app.zip | grep -F "vibeEmu.app/Contents/MacOS/LICENSE"
          unzip -l dist/macos/vibeEmu.app.zip | grep -F "vibeEmu.app/Contents/MacOS/THIRD_PARTY_LICENSES.html"
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeEmu-macos-universal
          path: dist/macos/vibeEmu.app.zip
          if-no-files-found: error
          retention-days: 30
