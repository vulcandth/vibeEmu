[package]
name = "vibe-emu-mobile-sys"
version = "0.0.1"
edition = "2024"
authors = ["vulcandth <vulcandth@gmail.com>"]
description = "Low-level libmobile bindings for vibeEmu"
repository = "https://github.com/vulcandth/vibeEmu"
license = "MIT"
publish = false

# A "-sys" crate: low-level FFI + linking/build.
links = "mobile"
build = "build.rs"

[features]
# Build libmobile from the vendored source under crates/vibe-emu-mobile/vendor/.
bundled = []
# Link to a system-provided libmobile (e.g. -lmobile plus optional search path).
system = []

[build-dependencies]
cc = "1.2.56"

[dependencies]
