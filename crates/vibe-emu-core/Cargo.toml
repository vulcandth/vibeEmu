[package]
name = "vibe-emu-core"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
authors = ["vulcandth <vulcandth@gmail.com>"]
description = "Cycle-accurate Game Boy / Game Boy Color emulation library"
repository = "https://github.com/vulcandth/vibeEmu"
license = "MIT"
readme = "README.md"
keywords = ["gameboy", "emulator", "gbc", "dmg", "emulation"]
categories = ["emulators", "game-development"]
include = [
    "src/**",
    "tests/**",
    "tests/reference_screenshots/**",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "!test_roms/**/README*",
    "THIRD_PARTY_LICENSES.md",
    "about.toml",
    "about.hbs",
]

[dependencies]


[features]
default = []
ppu-trace = []
apu-trace = []
cpu-trace = []

[dev-dependencies]
once_cell = "1"
tempfile = "3"
reqwest = { version = "0.13.2", features = ["blocking", "gzip"] }
zip = "8.4.0"
png = "0.18"
libtest-mimic = "0.8.2"

[[test]]
name = "gambatte"
path = "tests/gambatte.rs"
harness = false
# Exclude from default test runs - use `cargo gambatte_test` to run explicitly
test = false
