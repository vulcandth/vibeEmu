[package]
name = "vibe-emu-ui"
version = "0.0.1"
edition = "2024"
authors = ["vulcandth <vulcandth@gmail.com>"]
description = "Desktop UI for the vibeEmu Game Boy emulator"
repository = "https://github.com/vulcandth/vibeEmu"
license = "MIT"
publish = false

[features]
mobile-bundled = ["vibe-emu-mobile/bundled"]
mobile-system = ["vibe-emu-mobile/system"]

default = ["mobile-bundled"]

[dependencies]
vibe-emu-core.workspace = true
vibe-emu-mobile = { path = "../vibe-emu-mobile" }
clap = { version = "4.5.58", features = ["derive"] }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
cpal = "0.17"
png = "0.18"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1.1.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
gilrs = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["vulkan", "gles"] }
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.17.2" }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "27", default-features = false, features = ["dx12", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", default-features = false, features = ["metal"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
