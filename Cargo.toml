[workspace]
members = [
    "crates/vibe-emu-frontend",
    "crates/vibe-emu-core",
    "crates/vibe-emu-ui",
    "crates/vibe-emu-mobile-sys",
    "crates/vibe-emu-mobile",
    "crates/vibe-emu-android",
]
resolver = "2"

[workspace.dependencies]
vibe-emu-core = { version = "0.0.2", path = "crates/vibe-emu-core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
# egui_dock 0.19.1 without the unmaintained paste macro; see vendor/egui_dock/PATCH.md.
egui_dock = { path = "vendor/egui_dock" }
