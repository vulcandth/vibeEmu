[workspace]
members = [
    "crates/vibe-emu-core",
    "crates/vibe-emu-ui",
    "crates/vibe-emu-mobile-sys",
    "crates/vibe-emu-mobile",
]
resolver = "2"

[workspace.dependencies]
vibe-emu-core = { version = "0.0.2", path = "crates/vibe-emu-core" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
