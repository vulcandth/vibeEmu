[package]
name = "vibeEmu"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
winit = "0.30"
wgpu = "0.20"
pollster = "0.3"
egui = "0.27"
egui-winit = "0.27"
egui-wgpu = "0.27"
bytemuck = { version = "1", features = ["derive"] }
cpal = "0.15"
log = "0.4"
env_logger = "0.10"

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
image = { version = "0.24", default-features = false, features = ["png"] }
once_cell = "1"
reqwest = { version = "0.11", features = ["blocking", "gzip"] }
zip = "0.6"
