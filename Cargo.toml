[package]
name = "vibeEmu"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
winit = "0.29"
pixels = "0.13"
cpal = "0.15"
minifb = "0.25"
egui = "0.27"
egui_extras = "0.27"
tiny-skia = "0.11"
log = "0.4"
env_logger = "0.10"

[lib]
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3"
image = { version = "0.24", default-features = false, features = ["png"] }
once_cell = "1"
reqwest = { version = "0.11", features = ["blocking", "gzip"] }
zip = "0.6"
